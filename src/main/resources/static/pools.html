<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Датапул: состояние пулов</title>
<style>
 body{font-family:sans-serif;margin:16px}
 table{border-collapse:collapse}
 th,td{border:1px solid #bbb;padding:4px 8px;text-align:right}
 th{cursor:pointer;background:#eee;user-select:none}
 td.l,th.l{text-align:left}
 tr.bad{background:#fdd}
 button{margin:0 4px}
 #msg{margin:8px 0;white-space:pre-wrap}
</style>
</head>
<body>
<h2>Состояние пулов</h2>
<div>
 <button onclick="load()">Обновить</button>
 <button onclick="repairSelected()">Исправить выбранные</button>
 <label><input type="checkbox" id="onlyBad" onchange="render()"> только расходящиеся</label>
</div>
<div id="msg"></div>
<table id="t"><thead></thead><tbody></tbody></table>
<script>
const cols=[['pool','Пул'],['diverged','Расхождение'],['lockerSize','Размер локера'],['dbMaxRid','max(rid) в БД'],['dbRows','Строк в БД'],['holes','Дыры'],['dbLocked','locked в БД'],['lockerLocked','locked в локере'],['lockedOnlyInDb','только в БД'],['lockedOnlyInLocker','только в локере'],['empty','empty'],['cursor','Курсор'],['cursorEpoch','Эпоха']];
let data=[],sortKey=null,sortDir=1;
function load(){fetch('api/v1/pools').then(r=>r.json()).then(d=>{data=d;render();});}
function sortBy(k){if(sortKey===k)sortDir=-sortDir;else{sortKey=k;sortDir=1;}render();}
function render(){
 const only=document.getElementById('onlyBad').checked;
 let rows=data.filter(r=>!only||r.diverged);
 if(sortKey)rows=rows.slice().sort((a,b)=>{const x=a[sortKey],y=b[sortKey];return (x>y?1:x<y?-1:0)*sortDir;});
 const th=document.querySelector('#t thead');
 th.innerHTML='<tr><th><input type="checkbox" onclick="toggleAll(this)"></th>'+cols.map(c=>`<th class="${c[0]==='pool'?'l':''}" onclick="sortBy('${c[0]}')">${c[1]}${sortKey===c[0]?(sortDir>0?' ▲':' ▼'):''}</th>`).join('')+'<th>Действие</th></tr>';
 document.querySelector('#t tbody').innerHTML=rows.map(r=>`<tr class="${r.diverged?'bad':''}"><td><input type="checkbox" class="sel" value="${r.pool}"></td>`+
  cols.map(c=>`<td class="${c[0]==='pool'?'l':''}">${r[c[0]]===null||r[c[0]]===undefined?'':r[c[0]]}</td>`).join('')+
  `<td><button onclick="repairOne('${r.pool}')">Исправить/сбросить счётчик</button></td></tr>`).join('');
}
function toggleAll(cb){document.querySelectorAll('.sel').forEach(c=>c.checked=cb.checked);}
function post(pools){
 return fetch('api/v1/pools/repair-batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(pools)})
  .then(r=>r.json()).then(res=>{document.getElementById('msg').textContent=res.map(x=>x.pool+': '+(x.ok?'исправлен, размер '+x.lockerSize+', курсор '+x.cursor:'ошибка '+x.message)).join('\n');load();});
}
function repairOne(p){post([p]);}
function repairSelected(){const p=[...document.querySelectorAll('.sel:checked')].map(c=>c.value);if(!p.length){document.getElementById('msg').textContent='Ничего не выбрано';return;}post(p);}
load();
</script>
</body>
</html>
